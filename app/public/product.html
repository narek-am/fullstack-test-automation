<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ShopLite - a small demo shop used for test automation.">
  <title>Product | ShopLite</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/pages/product.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/" data-testid="brand">ShopLite</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="/" data-testid="nav-products">Products</a></li>
        <li class="hidden"><a href="/orders" data-testid="nav-orders">My orders</a></li>
        <li><a href="/cart" data-testid="nav-cart">Cart <span class="cart-count" data-testid="cart-count" aria-label="items in cart">0</span></a></li>
        <li><a href="/login" data-testid="nav-login">Log in</a></li>
        <li class="hidden"><span data-testid="nav-greeting"></span> <button type="button" class="button link" data-testid="nav-logout">Log out</button></li>
      </ul>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <p class="alert" role="alert" data-testid="message"></p>
    <article class="product-detail hidden" data-testid="product-detail">
      <img src="" alt="" data-testid="product-image" width="320" height="240">
      <div>
        <p class="muted" data-testid="product-category"></p>
        <h1 data-testid="product-name"></h1>
        <p data-testid="product-description"></p>
        <p class="price" data-testid="product-price"></p>
        <p data-testid="product-stock"></p>
        <form data-testid="add-to-cart-form" class="filters">
          <div class="field">
            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" max="99" value="1" data-testid="quantity-input">
          </div>
          <button class="button" type="submit" data-testid="add-to-cart">Add to cart</button>
        </form>
      </div>
    </article>
    <p><a href="/">&larr; Back to all products</a></p>
  </main>
  <footer class="site-footer">
    <p>ShopLite is a demo application for test automation practice. No real orders are placed.</p>
  </footer>
</body>
</html>
