name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-integration:
    name: Unit & integration (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:coverage -- --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage/
          retention-days: 7

  data-quality:
    name: Data quality (SQL checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            data-tests/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: data-tests
      - run: npm test -- --ci
        working-directory: data-tests

  data-kafka:
    name: Data (Kafka events, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            data-tests/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: data-tests
      # No KAFKA_BROKERS set: the test starts its own Kafka container (Docker is available on the runner).
      - run: npm run test:kafka -- --ci
        working-directory: data-tests

  api-postman:
    name: API (Postman + Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            api-tests/postman/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: api-tests/postman
      - run: npm test
        working-directory: api-tests/postman
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-reports
          path: api-tests/postman/reports/
          retention-days: 7

  api-java:
    name: API + data (REST Assured, Karate, JDBC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
        working-directory: app
      - run: ./mvnw -B test
        working-directory: java-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: |
            java-tests/target/surefire-reports/
            java-tests/target/karate-reports/
          retention-days: 7

  contract:
    name: Contract (Pact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            contract-tests/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: contract-tests
      - run: npm test
        working-directory: contract-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-file
          path: contract-tests/pacts/
          retention-days: 7

  ui-playwright:
    name: UI (Playwright, 3 browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/playwright/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: e2e/playwright
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e/playwright
      - run: npx playwright test
        working-directory: e2e/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright/playwright-report/
            e2e/playwright/test-results/
          retention-days: 7

  ui-cypress:
    name: UI (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/cypress/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('e2e/cypress/package-lock.json') }}
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: e2e/cypress
      - run: npm test
        working-directory: e2e/cypress
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e/cypress/cypress/screenshots/
          retention-days: 7
