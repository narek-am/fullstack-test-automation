name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-integration:
    name: Unit & integration (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:coverage -- --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage/
          retention-days: 7

  data-quality:
    name: Data quality (SQL checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            data-tests/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: data-tests
      - run: npm test -- --ci
        working-directory: data-tests

  data-kafka:
    name: Data (Kafka events, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            data-tests/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: data-tests
      # No KAFKA_BROKERS set: the test starts its own Kafka container (Docker is available on the runner).
      - run: npm run test:kafka -- --ci
        working-directory: data-tests

  api-postman:
    name: API (Postman + Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            api-tests/postman/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: api-tests/postman
      - run: npm test
        working-directory: api-tests/postman
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-reports
          path: api-tests/postman/reports/
          retention-days: 7

  api-java:
    name: API, data & architecture (REST Assured, Karate, JDBC, ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
        working-directory: app
      - run: ./mvnw -B test
        working-directory: java-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: |
            java-tests/target/surefire-reports/
            java-tests/target/karate-reports/
          retention-days: 7

  contract:
    name: Contract (Pact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            contract-tests/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: contract-tests
      - run: npm test
        working-directory: contract-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-file
          path: contract-tests/pacts/
          retention-days: 7

  security-api:
    name: Security (API tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            security-tests/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: security-tests
      - run: npm test -- --ci
        working-directory: security-tests

  security-dependencies:
    name: Security (dependency scan)
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.7.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Gate: anything that ships with the shop must be free of known vulnerabilities.
      # Test tooling is listed in the job summary but does not block (see security-tests/README.md).
      - name: npm audit (all npm projects)
        run: node security-tests/scripts/npm-audit-report.mjs
      # OSV-Scanner covers both ecosystems, including the Maven test project and its transitive
      # dependencies. Report only: every Maven dependency here is a test tool.
      - name: Install OSV-Scanner (checksum verified)
        run: |
          base=https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION
          curl -sSfL -o osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
          curl -sSfL "$base/osv-scanner_SHA256SUMS" | grep ' osv-scanner_linux_amd64$' | sha256sum -c -
          install -m 755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
      - name: OSV-Scanner (npm + Maven)
        run: |
          status=0
          osv-scanner scan source --recursive --format markdown --output osv-report.md . || status=$?
          osv-scanner scan source --recursive --format html --output osv-report.html . || true
          { echo '## OSV-Scanner'; echo; cat osv-report.md; } >> "$GITHUB_STEP_SUMMARY"
          # 0 = nothing found, 1 = vulnerabilities found (reported above); anything else is a scanner error.
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-report
          path: osv-report.*
          retention-days: 7

  security-secrets:
    name: Security (secret scan)
    runs-on: ubuntu-latest
    env:
      TALISMAN_VERSION: v1.37.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the latest tree
      - name: Install Talisman (checksum verified)
        run: |
          base=https://github.com/thoughtworks/talisman/releases/download/$TALISMAN_VERSION
          curl -sSfL -o talisman_linux_amd64 "$base/talisman_linux_amd64"
          curl -sSfL "$base/checksums" | grep ' talisman_linux_amd64$' | sha256sum -c -
          install -m 755 talisman_linux_amd64 /usr/local/bin/talisman
      - name: Scan the git history for secrets
        run: talisman --scan
      - name: Report Talisman findings
        if: always()
        run: node security-tests/scripts/talisman-summary.mjs talisman_report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talisman-report
          path: talisman_report/
          retention-days: 7

  security-zap:
    name: Security (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    env:
      ZAP_IMAGE: zaproxy/zap-stable:2.17.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --omit=dev
        working-directory: app
      - name: Start ShopLite
        run: |
          PORT=3000 DB_PATH="$RUNNER_TEMP/zap.db" nohup node app/src/index.js > "$RUNNER_TEMP/app.log" 2>&1 &
          curl -sSf --retry 20 --retry-delay 1 --retry-all-errors http://localhost:3000/api/health
      # Passive scan only: ZAP spiders the site (including JS-rendered links) and inspects every
      # response, but sends no attacks. -I: warnings are reported; only FAIL rules break the build.
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && cp security-tests/zap/rules.tsv zap/ && chmod -R a+rwX zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:3000 -j -m 2 -I \
              -c rules.tsv -r zap-report.html -J zap-report.json
      - name: Summarise ZAP findings
        if: always()
        run: node security-tests/zap/summarize.mjs zap/zap-report.json security-tests/zap/rules.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap/
          retention-days: 7

  performance-load:
    name: Performance (Apache Bench, JMeter, Gatling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci --omit=dev
        working-directory: app
      - name: Install Apache Bench
        run: command -v ab || (sudo apt-get update -q && sudo apt-get install -y -q apache2-utils)
      - name: Start ShopLite with load-test data
        run: |
          nohup node performance-tests/scripts/start-app.mjs 3400 > "$RUNNER_TEMP/app.log" 2>&1 &
          curl -sSf --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:3400/api/health
      # The three tools run one after another, so they don't compete for the runner's CPU.
      - name: Apache Bench (single endpoints)
        run: performance-tests/ab/benchmark.sh
        env:
          OUT: performance-tests/ab/results
      - name: JMeter (closed workload, 25 shoppers)
        run: ./mvnw -B -Pjmeter verify
        working-directory: performance-tests/jvm
      - name: Gatling (open workload, visitors and buyers)
        if: success() || failure()
        run: ./mvnw -B gatling:test
        working-directory: performance-tests/jvm
      - name: App log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/app.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-reports
          path: |
            performance-tests/ab/results/
            performance-tests/jvm/target/jmeter/reports/
            performance-tests/jvm/target/jmeter/results/
            performance-tests/jvm/target/gatling/
          retention-days: 7

  performance-lighthouse:
    name: Performance (Lighthouse CI budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            performance-tests/package-lock.json
      - run: npm ci --omit=dev
        working-directory: app
      - run: npm ci
        working-directory: performance-tests
      # Uses the Google Chrome that is preinstalled on the runner.
      - run: npm run lighthouse
        working-directory: performance-tests
      - name: Report Lighthouse results
        if: always()
        run: node performance-tests/scripts/lighthouse-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: performance-tests/lighthouse/results/
          retention-days: 7

  accessibility:
    name: Accessibility (axe-core, keyboard, Pa11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/playwright/package-lock.json
            accessibility-tests/package-lock.json
      - run: npm ci --omit=dev
        working-directory: app
      - run: npm ci
        working-directory: e2e/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: e2e/playwright
      - name: axe-core scans and keyboard tests (Playwright)
        run: npx playwright test --project=a11y
        working-directory: e2e/playwright
      - run: npm ci
        working-directory: accessibility-tests
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Pa11y CI (HTML_CodeSniffer + axe)
        run: npm test
        working-directory: accessibility-tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: e2e/playwright/playwright-report/
          retention-days: 7

  cfr:
    name: Chaos & architecture (Playwright, dependency-cruiser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            cfr-tests/package-lock.json
      - run: npm ci --omit=dev
        working-directory: app
      - run: npm ci
        working-directory: cfr-tests
      - name: Architecture rules (dependency-cruiser)
        run: npm run architecture
        working-directory: cfr-tests
      - run: npx playwright install --with-deps chromium
        working-directory: cfr-tests
      - name: Chaos experiments
        run: npm run chaos
        working-directory: cfr-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: cfr-tests/playwright-report/
          retention-days: 7

  mobile-appium:
    name: Mobile (Appium, Chrome on Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            mobile-tests/package-lock.json
      # Hardware acceleration for the emulator on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci --omit=dev
        working-directory: app
      - run: npm ci
        working-directory: mobile-tests
      - name: Start ShopLite (reachable from the emulator as 10.0.2.2)
        run: |
          nohup node mobile-tests/scripts/start-app.mjs 3701 > "$RUNNER_TEMP/app.log" 2>&1 &
          curl -sSf --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:3701/api/health
      - name: Appium tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: mobile-tests
          script: npm test
      - name: Show the cause of a failure
        if: failure()
        run: node mobile-tests/scripts/annotate-failures.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-log
          path: |
            mobile-tests/appium.log
            mobile-tests/logs/
          retention-days: 7

  ui-playwright:
    name: UI (Playwright, 3 browsers + 2 phones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/playwright/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: e2e/playwright
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e/playwright
      - run: npx playwright test --project=chromium --project=firefox --project=webkit --project=mobile-android --project=mobile-ios
        working-directory: e2e/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright/playwright-report/
            e2e/playwright/test-results/
          retention-days: 7

  ui-cypress:
    name: UI (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/cypress/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('e2e/cypress/package-lock.json') }}
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: e2e/cypress
      - run: npm test
        working-directory: e2e/cypress
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e/cypress/cypress/screenshots/
          retention-days: 7

  visual-backstop:
    name: Visual (BackstopJS)
    # Reference images were made on macOS; font rendering differs on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            visual-tests/backstop/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: visual-tests/backstop
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm test
        working-directory: visual-tests/backstop
      - name: Report visual diffs as annotations
        if: failure()
        run: node scripts/annotate-failures.mjs
        working-directory: visual-tests/backstop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backstop-report
          path: |
            visual-tests/backstop/backstop_data/html_report/
            visual-tests/backstop/backstop_data/bitmaps_test/
          retention-days: 7

  visual-playwright:
    name: Visual (Playwright screenshots)
    # Baselines are stored per platform (*-darwin.png) and approved on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/playwright/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: e2e/playwright
      - run: npx playwright install chromium
        working-directory: e2e/playwright
      - run: npx playwright test --project=visual
        working-directory: e2e/playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-diffs
          path: e2e/playwright/test-results/
          retention-days: 7
